org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.suppressUnsupportedCompileSdk=35

kotlin.code.style=official

# ---------------------------------------------------------------------------
# 生图后端（stable-diffusion.cpp）预编译库
# ---------------------------------------------------------------------------
# 从 GitHub Release 拉取，避免每个开发者本机编 476 个 C/C++ 文件。
# 产物来自 .github/workflows/prebuilt-sd.yml。
# 留空 / 拉取失败都会静默回退到本机编译，不会让构建挂掉。
localmind.sdPrebuiltVersion=sd-1.0.0
# 换成你自己的 用户名/仓库 即可使用自己编的库
localmind.sdPrebuiltRepo=
