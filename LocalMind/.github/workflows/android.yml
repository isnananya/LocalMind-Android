name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 允许打 tag 时发布 Release
permissions:
  contents: write

jobs:
  build:
    # debug / release 拆成两个 job **并行**跑：原来串行各编一遍原生层，总时长 20+ 分钟；
    # 并行后总时长 = max(debug, release) ≈ 一半。
    #
    # 注意两个 job 的 CMake 缓存键必须带 variant —— debug 与 release 的 .cxx 对象文件
    # 是两套，共用同一个键会互相覆盖、两边都缓存不命中。
    strategy:
      fail-fast: false
      matrix:
        variant: [ debug, release ]

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------------
      # llama.cpp 必须**固定到 tag**，不能克隆最新 main。
      #
      # 本工程的 native 层（app/src/main/cpp/llama_jni.cpp，60 KB）对着
      # llama.cpp v0.6.0 的 API 写：llama_init_from_model / llama_get_memory /
      # llama_model_has_encoder / mtmd_* 这一套都是 v0.6.x 的形状。
      # 上游到 v0.9.0 之间改过一批接口（llama_context 内存访问、采样器命名等），
      # 克隆 main 会直接编译失败，而且是那种"报错位置看不懂为什么"的失败。
      #
      # 验证方式：本地 third_party/llama.cpp 是 v0.6.0 的源码快照，
      # include/llama.h 与 tools/mtmd/mtmd.h 的 blob 哈希与上游 v0.6.0 完全一致
      # （9bca8ee / bcd76a9），所以钉住 v0.6.0 就是钉住本机验证过的那个版本。
      #
      # 要升级 llama.cpp 时：先在本机改 native 层并跑通，再改这里这个变量，
      # 不要单独改版本号。
      - name: Fetch llama.cpp (pinned)
        env:
          LLAMA_CPP_REF: v0.6.0
        run: |
          set -euo pipefail
          if [ ! -f third_party/llama.cpp/include/llama.h ]; then
            git clone --depth 1 --branch "$LLAMA_CPP_REF" \
              https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          fi
          git -C third_party/llama.cpp log -1 --oneline
          grep -m1 'LLAMA_VERSION_MINOR' third_party/llama.cpp/CMakeLists.txt || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------------------------
      # packages 必须**显式指定**，不能吃默认值。
      #
      # setup-android@v3 的默认是 `tools platform-tools`，而 `tools` 这个包
      # 已经被 Google 从 SDK 仓库里下架了 —— 装的时候会报
      #   Warning: Failed to find package 'tools'
      #   Error: The process '.../sdkmanager' failed with exit code 1
      # 整个 job 在这一步就挂掉，后面什么都没跑。
      #
      # 这里只装真正需要的（platform-tools），其余的
      # platform / ndk / cmake 由下面那个 sdkmanager --install 步骤统一装。
      # ---------------------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true

      - name: Install SDK / NDK / CMake
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" \
                              "ndk;27.0.12077973" "cmake;3.22.1" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # CMake/Ninja 的中间产物。llama.cpp 是几百个编译单元，缓存命中能省十几分钟。
      # 键里带 matrix.variant：debug 与 release 的对象文件不能互相污染。
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: cxx-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: cxx-${{ runner.os }}-${{ matrix.variant }}-

      # ---------------------------------------------------------------------------
      # CI 只编 arm64-v8a 一个 ABI —— 原生层（llama.cpp）编译时间直接减半。
      #
      # 2026 年在售手机几乎全是 arm64，armeabi-v7a 只剩极少量的老设备。
      # 需要全量（含 v7a / x86_64 模拟器）时本地跑：
      #   ./gradlew assembleDebug            # 默认就是 arm64 + v7a
      #   ./gradlew assembleDebug -PabiList=arm64-v8a,x86_64
      # CI 产物只含 arm64，装到 v7a 老设备上"App not installed"是预期行为，不是 bug。
      # ---------------------------------------------------------------------------
      - name: Build ${{ matrix.variant }} APK (arm64 only)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assemble${{ matrix.variant == 'debug' && 'Debug' || 'Release' }} \
            -PabiList=arm64-v8a --no-daemon --stacktrace

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalMind-${{ matrix.variant }}-apk
          path: app/build/outputs/apk/${{ matrix.variant }}/*.apk
          if-no-files-found: error

      # 打 v* tag 时把 APK 挂到 Release 上，不用再去 Actions 页面翻 artifact。
      # 只在 release job 跑。release 包用 debug key 签名（见 app/build.gradle.kts），
      # 所以只能自用、不能上架应用商店 —— 这是刻意的，别改。
      - name: Publish Release (on tag)
        if: matrix.variant == 'release' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            由 GitHub Actions 自动构建（arm64-v8a）。

            - 安装包用 **debug key** 签名，仅供自用/内测，不能上架应用商店。
            - 首次启动需要下载模型权重与（可选）神经语音引擎。
